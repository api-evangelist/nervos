name: Nervos
description: >-
  Nervos is the organization behind Nervos CKB (Common Knowledge Base), a proof-of-work
  layer 1 blockchain built around the Cell Model - a flexible, UTXO-like state model - and
  CKB-VM, a RISC-V virtual machine for on-chain scripts. Developers interact with the
  network through a public JSON-RPC 2.0 API (HTTP, TCP, and WebSocket subscriptions),
  official SDKs for JavaScript/TypeScript (CCC), Rust, Go, and Java, and CLI tooling
  (ckb-cli, OffCKB). The docs surface first-class AI resources including an llms.txt map,
  agent instructions, packaged CKB Dev Skills, and a CKB AI MCP server. Nervos was
  surfaced as a portfolio company of Multicoin Capital and enriched from its public
  developer documentation.

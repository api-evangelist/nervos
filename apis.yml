apis:
- name: CKB JSON-RPC API
  description: >-
    Public JSON-RPC 2.0 interface to Nervos CKB nodes for querying chain state (blocks,
    transactions, cells), submitting signed transactions, and subscribing to new-tip
    events over WebSocket. Unauthenticated on public endpoints; transaction authorization
    is enforced on-chain by lock scripts and signatures.
